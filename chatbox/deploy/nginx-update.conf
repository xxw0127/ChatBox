# ChatBox update feed. The same nginx instance terminates TLS on 443 while
# port 9443 remains the raw TCP stream for the application protocol.
server {
    listen 443 ssl;
    server_name 121.5.168.189;

    ssl_certificate     /etc/chatbox/certs/chat.crt;
    ssl_certificate_key /etc/chatbox/certs/chat.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ChatBoxUpdate:1m;
    ssl_session_timeout 10m;

    root /var/www;

    location /updates/ {
        alias /var/www/chatbox-updates/;
        autoindex off;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = / {
        return 404;
    }

    location / {
        return 404;
    }
}
